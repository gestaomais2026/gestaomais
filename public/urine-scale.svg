<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Escala de coloração da urina</title>
  <desc id="desc">Cores numeradas de 1 a 8, indo do amarelo claro ao âmbar escuro, com indicação de hidratação.</desc>
  <rect width="760" height="520" fill="#fff"/>
  <text x="380" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#4F4E3A">Coloração da Urina</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#4F4E3A">
    <text x="78" y="106" text-anchor="middle">1</text><text x="78" y="158" text-anchor="middle">2</text>
    <text x="78" y="210" text-anchor="middle">3</text><text x="78" y="262" text-anchor="middle">4</text>
    <text x="78" y="314" text-anchor="middle">5</text><text x="78" y="366" text-anchor="middle">6</text>
    <text x="78" y="418" text-anchor="middle">7</text><text x="78" y="470" text-anchor="middle">8</text>
  </g>
  <g stroke="#D5CFBE" stroke-width="1">
    <rect x="105" y="78" width="290" height="38" rx="5" fill="#FFFDE1"/><rect x="105" y="130" width="290" height="38" rx="5" fill="#FFF9B5"/>
    <rect x="105" y="182" width="290" height="38" rx="5" fill="#FFF26A"/><rect x="105" y="234" width="290" height="38" rx="5" fill="#F8D21B"/>
    <rect x="105" y="286" width="290" height="38" rx="5" fill="#F0C52C"/><rect x="105" y="338" width="290" height="38" rx="5" fill="#D9A927"/>
    <rect x="105" y="390" width="290" height="38" rx="5" fill="#C58F21"/><rect x="105" y="442" width="290" height="38" rx="5" fill="#8D813A"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" fill="#4F4E3A">
    <text x="470" y="130">1–2  bem hidratado</text><text x="470" y="260">3–4  levemente desidratado</text>
    <text x="470" y="390">5–6  moderadamente desidratado</text><text x="470" y="460">7–8  severamente desidratado</text>
  </g>
</svg>
